<!DOCTYPE html>
<html lang="de" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>King Quests - Pure Kalender</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; user-select: none; touch-action: manipulation; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .modal-slide-up {
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-full flex flex-col font-sans overflow-hidden">

    <!-- Haupt-App Container -->
    <div class="max-w-md w-full mx-auto h-full flex flex-col bg-slate-900 relative shadow-2xl border-x border-slate-800">
        
        <!-- Header -->
        <header class="px-5 pt-5 pb-3 bg-slate-900/95 backdrop-blur-md z-20 border-b border-slate-800 flex items-center justify-between shrink-0">
            <div>
                <div class="flex items-center gap-2">
                    <i data-lucide="crown" class="w-5 h-5 text-amber-400"></i>
                    <h1 class="text-lg font-black tracking-tight text-white">King Quests</h1>
                </div>
                <span id="streak-badge" class="inline-flex items-center gap-1 text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-400 border border-amber-500/30 mt-0.5">
                    <i data-lucide="flame" class="w-3 h-3"></i> <span id="streak-count">0</span> Tage Serie
                </span>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="openBriefing()" class="w-9 h-9 rounded-xl bg-slate-800 text-amber-400 border border-amber-400/20 flex items-center justify-center active:scale-95 transition-transform">
                    <i data-lucide="sun" class="w-4.5 h-4.5"></i>
                </button>
                <button onclick="openCreateModal()" class="w-9 h-9 rounded-xl bg-indigo-600 text-white flex items-center justify-center shadow-lg shadow-indigo-600/30 active:scale-95 transition-transform">
                    <i data-lucide="plus" class="w-5 h-5"></i>
                </button>
            </div>
        </header>

        <!-- HAUPTANSICHT: NUR DER GROSSE KALENDER -->
        <main class="flex-1 flex flex-col p-4 overflow-y-auto no-scrollbar justify-center">
            
            <div class="bg-slate-800/90 rounded-3xl p-4 border border-slate-700/80 shadow-2xl">
                <!-- Monat & Navigation -->
                <div class="flex justify-between items-center mb-5 px-2">
                    <button onclick="changeMonth(-1)" class="p-2 text-slate-400 hover:text-white bg-slate-700/50 rounded-xl active:scale-90 transition-transform">
                        <i data-lucide="chevron-left" class="w-6 h-6"></i>
                    </button>
                    <div class="text-center">
                        <h2 id="month-year-label" class="text-lg font-black text-white"></h2>
                        <button onclick="selectToday()" class="text-[10px] text-indigo-400 font-bold uppercase tracking-wider mt-0.5">Heute anzeigen</button>
                    </div>
                    <button onclick="changeMonth(1)" class="p-2 text-slate-400 hover:text-white bg-slate-700/50 rounded-xl active:scale-90 transition-transform">
                        <i data-lucide="chevron-right" class="w-6 h-6"></i>
                    </button>
                </div>

                <!-- Wochentage -->
                <div class="grid grid-cols-7 gap-1 text-center text-xs font-bold text-slate-400 mb-3">
                    <div>Mo</div><div>Di</div><div>Mi</div><div>Do</div><div>Fr</div><div>Sa</div><div>So</div>
                </div>

                <!-- Kalender-Tage Grid (Große Touch-Flächen) -->
                <div id="calendar-grid" class="grid grid-cols-7 gap-1.5 text-center text-sm"></div>
            </div>

            <!-- Hinweis am unteren Rand -->
            <p class="text-center text-xs text-slate-500 mt-6 font-medium">
                Tippe auf einen Tag, um den Zeitstrahl & die Aufgaben zu öffnen
            </p>

        </main>

        <!-- TAGES-OVERLAY (Öffnet sich beim Tippen auf einen Tag) -->
        <div id="day-sheet" class="fixed inset-0 bg-black/80 backdrop-blur-md z-40 flex items-end justify-center hidden opacity-0 transition-opacity duration-200">
            <div class="bg-slate-900 w-full max-w-md h-[88vh] rounded-t-3xl border-t border-slate-700/80 flex flex-col shadow-2xl transform translate-y-full modal-slide-up overflow-hidden">
                
                <!-- Sheet Header -->
                <div class="p-4 bg-slate-800/90 border-b border-slate-700/80 flex justify-between items-center shrink-0">
                    <div>
                        <span class="text-[10px] font-bold text-indigo-400 uppercase tracking-wider">Tagesübersicht</span>
                        <h3 id="day-sheet-title" class="font-black text-base text-white">00.00.0000</h3>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="openCreateModal(selectedDateStr)" class="px-3 py-1.5 bg-indigo-600 text-white rounded-xl text-xs font-bold flex items-center gap-1 active:scale-95 transition-transform">
                            <i data-lucide="plus" class="w-3.5 h-3.5"></i> Quest
                        </button>
                        <button onclick="closeDaySheet()" class="p-2 text-slate-400 hover:text-white rounded-xl bg-slate-800 border border-slate-700">
                            <i data-lucide="x" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>

                <!-- Sheet Inhalt (Scrollbar) -->
                <div class="flex-1 overflow-y-auto no-scrollbar p-4 space-y-5">
                    
                    <!-- BEREICH 1: UNTERMINIERTE TODOS -->
                    <div class="space-y-2">
                        <div class="flex justify-between items-center">
                            <span class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
                                <i data-lucide="check-square" class="w-3.5 h-3.5 text-amber-400"></i> Noch nicht terminiert
                            </span>
                            <span id="untimed-count" class="text-[10px] bg-slate-800 text-slate-400 font-bold px-2 py-0.5 rounded-full">0</span>
                        </div>
                        <div id="untimed-list" class="space-y-2"></div>
                    </div>

                    <hr class="border-slate-800">

                    <!-- BEREICH 2: VORHANDENER ZEITSTRAHL (TIMELINE) -->
                    <div class="space-y-2">
                        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
                            <i data-lucide="clock" class="w-3.5 h-3.5 text-indigo-400"></i> Zeitstrahl
                        </span>
                        
                        <div id="timeline-container" class="relative pl-12 space-y-4 pt-2">
                            <!-- Zeitstrahl wird hier dynamisch generiert -->
                        </div>
                    </div>

                </div>

            </div>
        </div>

        <!-- MODAL: ERSTELLEN / BEARBEITEN -->
        <div id="modal" class="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-end justify-center hidden opacity-0 transition-opacity duration-200">
            <div class="bg-slate-900 w-full max-w-md rounded-t-3xl p-5 border-t border-slate-800 space-y-3.5 max-h-[90vh] overflow-y-auto no-scrollbar">
                <div class="flex justify-between items-center">
                    <h3 id="modal-title-text" class="font-bold text-white text-base">Eintrag erstellen</h3>
                    <button onclick="closeModal()" class="text-slate-400 p-1"><i data-lucide="x" class="w-5 h-5"></i></button>
                </div>
                
                <input type="hidden" id="edit-item-id">

                <div class="grid grid-cols-2 gap-2 p-1 bg-slate-800 rounded-xl border border-slate-700">
                    <button type="button" onclick="setType('todo')" id="type-btn-todo" class="py-1.5 text-xs font-bold rounded-lg bg-indigo-600 text-white transition-all">To-Do</button>
                    <button type="button" onclick="setType('event')" id="type-btn-event" class="py-1.5 text-xs font-bold rounded-lg text-slate-400 transition-all">Termin</button>
                </div>

                <input type="text" id="item-title" placeholder="Titel / Quest..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-500">
                
                <div class="grid grid-cols-2 gap-2.5">
                    <div>
                        <label class="text-[10px] text-slate-400 block mb-0.5">Datum</label>
                        <input type="date" id="item-date" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-2.5 py-2 text-xs text-white focus:outline-none">
                    </div>
                    <div>
                        <label class="text-[10px] text-slate-400 block mb-0.5">Wiederholung</label>
                        <select id="item-repeat" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-2 py-2 text-xs text-white focus:outline-none">
                            <option value="none">Keine</option>
                            <option value="daily">Täglich</option>
                            <option value="weekly">Wöchentlich</option>
                            <option value="monthly">Monatlich</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2.5">
                    <div>
                        <label class="text-[10px] text-slate-400 block mb-0.5">Startzeit (Optional)</label>
                        <input type="time" id="item-start-time" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-2.5 py-2 text-xs text-white focus:outline-none">
                    </div>
                    <div>
                        <label class="text-[10px] text-slate-400 block mb-0.5">Endzeit (Optional)</label>
                        <input type="time" id="item-end-time" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-2.5 py-2 text-xs text-white focus:outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2.5">
                    <div>
                        <label class="text-[10px] text-slate-400 block mb-0.5">Kategorie</label>
                        <select id="item-cat" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-2 py-2 text-xs text-white focus:outline-none"></select>
                    </div>
                    <div>
                        <label class="text-[10px] text-slate-400 block mb-0.5">Priorität</label>
                        <select id="item-prio" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-2 py-2 text-xs text-white focus:outline-none">
                            <option value="hoch">🔥 Hoch</option>
                            <option value="mittel" selected>⚡ Mittel</option>
                            <option value="niedrig">🌱 Niedrig</option>
                        </select>
                    </div>
                </div>

                <button onclick="saveItem()" class="w-full py-3 bg-indigo-600 text-white font-bold text-xs rounded-xl shadow-lg shadow-indigo-600/30 active:scale-95 transition-transform">
                    Speichern
                </button>
            </div>
        </div>

        <!-- BRIEFING MODAL -->
        <div id="briefing-modal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-200">
            <div class="bg-slate-900 w-full max-w-sm rounded-3xl p-5 border border-slate-800 space-y-4">
                <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                    <div class="flex items-center gap-2">
                        <i data-lucide="sun" class="w-5 h-5 text-amber-400"></i>
                        <h3 class="font-bold text-white text-base">King's Daily Briefing</h3>
                    </div>
                    <button onclick="closeBriefing()" class="text-slate-400 p-1"><i data-lucide="x" class="w-5 h-5"></i></button>
                </div>
                <div class="space-y-3" id="briefing-content"></div>
                <button onclick="closeBriefing()" class="w-full py-2.5 bg-amber-500 text-slate-950 font-black text-xs rounded-xl shadow-lg shadow-amber-500/20 active:scale-95 transition-transform">
                    Morgen-Quest starten!
                </button>
            </div>
        </div>

    </div>

    <script>
        const todayStr = new Date().toISOString().split('T')[0];
        let currentDate = new Date();
        let selectedDateStr = todayStr;
        let selectedType = 'todo';

        let categories = JSON.parse(localStorage.getItem('king_quests_categories')) || [
            { id: 'kq', name: 'King Quests', color: '#f59e0b' },
            { id: 'work', name: 'Arbeit', color: '#3b82f6' },
            { id: 'priv', name: 'Privat', color: '#10b981' }
        ];

        let items = JSON.parse(localStorage.getItem('king_quests_items_v6')) || [
            { id: 1, type: 'todo', title: 'Unterminiertes To-Do testen', date: todayStr, startTime: '', endTime: '', cat: 'King Quests', prio: 'mittel', repeat: 'none', done: false },
            { id: 2, type: 'event', title: 'Wichtiges Meeting', date: todayStr, startTime: '10:00', endTime: '11:30', cat: 'Arbeit', prio: 'hoch', repeat: 'none', done: false },
            { id: 3, type: 'todo', title: 'Workout & Training', date: todayStr, startTime: '17:00', endTime: '18:15', cat: 'Privat', prio: 'hoch', repeat: 'none', done: false }
        ];

        let streakData = JSON.parse(localStorage.getItem('king_quests_streak')) || { count: 0, lastDoneDate: '' };

        function saveData() {
            localStorage.setItem('king_quests_items_v6', JSON.stringify(items));
            localStorage.setItem('king_quests_categories', JSON.stringify(categories));
            localStorage.setItem('king_quests_streak', JSON.stringify(streakData));
            renderCalendar();
            if (!document.getElementById('day-sheet').classList.contains('hidden')) {
                renderDayDetails();
            }
            updateStreakUI();
        }

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const monthNames = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
            document.getElementById('month-year-label').textContent = `${monthNames[month]} ${year}`;

            const firstDayIndex = new Date(year, month, 1).getDay();
            const adjustedFirstDay = (firstDayIndex === 0 ? 6 : firstDayIndex - 1);
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < adjustedFirstDay; i++) grid.appendChild(document.createElement('div'));

            for (let d = 1; d <= daysInMonth; d++) {
                const monthFormatted = String(month + 1).padStart(2, '0');
                const dayFormatted = String(d).padStart(2, '0');
                const dateKey = `${year}-${monthFormatted}-${dayFormatted}`;

                const dayItems = items.filter(i => (i.date === dateKey || isRepeatingOn(i, dateKey)));
                const hasPending = dayItems.some(i => !i.done);
                const isToday = dateKey === todayStr;

                const dayBtn = document.createElement('button');
                dayBtn.onclick = () => openDaySheet(dateKey);

                let bgClass = "bg-slate-800/60 text-slate-300 hover:bg-slate-700/80";
                if (isToday) bgClass = "bg-indigo-600 text-white font-bold ring-2 ring-indigo-400 shadow-lg shadow-indigo-600/30";

                dayBtn.className = `h-12 rounded-2xl flex flex-col items-center justify-center relative transition-all active:scale-95 ${bgClass}`;
                dayBtn.innerHTML = `
                    <span class="text-sm font-semibold">${d}</span>
                    ${hasPending ? '<span class="w-1.5 h-1.5 rounded-full bg-amber-400 absolute bottom-1.5"></span>' : ''}
                `;
                grid.appendChild(dayBtn);
            }
            lucide.createIcons();
        }

        function openDaySheet(dateKey) {
            selectedDateStr = dateKey;
            const dateParts = dateKey.split('-');
            document.getElementById('day-sheet-title').textContent = `${dateParts[2]}.${dateParts[1]}.${dateParts[0]}`;
            
            renderDayDetails();

            const sheet = document.getElementById('day-sheet');
            sheet.classList.remove('hidden');
            setTimeout(() => {
                sheet.classList.remove('opacity-0');
                sheet.querySelector('.modal-slide-up').classList.remove('translate-y-full');
            }, 10);
        }

        function closeDaySheet() {
            const sheet = document.getElementById('day-sheet');
            sheet.querySelector('.modal-slide-up').classList.add('translate-y-full');
            sheet.classList.add('opacity-0');
            setTimeout(() => sheet.classList.add('hidden'), 250);
        }

        function renderDayDetails() {
            const untimedList = document.getElementById('untimed-list');
            const timelineContainer = document.getElementById('timeline-container');
            
            untimedList.innerHTML = '';
            timelineContainer.innerHTML = '';

            const dayItems = items.filter(i => i.date === selectedDateStr || isRepeatingOn(i, selectedDateStr));

            // 1. Unterminierte To-Dos
            const untimed = dayItems.filter(i => !i.startTime);
            document.getElementById('untimed-count').textContent = untimed.length;

            if (untimed.length === 0) {
                untimedList.innerHTML = `<p class="text-xs text-slate-500 italic py-1">Keine unterminierten Aufgaben.</p>`;
            } else {
                untimed.forEach(item => {
                    untimedList.appendChild(createItemCard(item));
                });
            }

            // 2. Zeitstrahl (Timeline für terminierte Einträge)
            const timed = dayItems.filter(i => i.startTime);
            timed.sort((a, b) => a.startTime.localeCompare(b.startTime));

            // Vertikale Zeitstrahl-Linie
            const line = document.createElement('div');
            line.className = "absolute left-4 top-0 bottom-0 w-0.5 bg-slate-800";
            timelineContainer.appendChild(line);

            if (timed.length === 0) {
                const empty = document.createElement('div');
                empty.className = "text-xs text-slate-500 italic py-2 pl-2";
                empty.textContent = "Keine fest terminierten Quests für diesen Tag.";
                timelineContainer.appendChild(empty);
            } else {
                timed.forEach(item => {
                    const row = document.createElement('div');
                    row.className = "relative flex items-start gap-3";

                    // Zeit-Marker links
                    let timeText = item.startTime;
                    if (item.endTime) timeText += `<br><span class="text-slate-500 text-[9px]">${item.endTime}</span>`;

                    row.innerHTML = `
                        <div class="absolute -left-12 top-1 text-right w-8 text-[11px] font-bold text-indigo-400 leading-tight">
                            ${timeText}
                        </div>
                        <div class="w-2.5 h-2.5 rounded-full bg-indigo-500 border-2 border-slate-900 absolute -left-[17px] top-2.5 z-10"></div>
                        <div class="flex-1 min-w-0">
                            ${createItemCardHTML(item)}
                        </div>
                    `;
                    timelineContainer.appendChild(row);
                });
            }

            lucide.createIcons();
        }

        function createItemCard(item) {
            const card = document.createElement('div');
            card.innerHTML = createItemCardHTML(item);
            return card.firstElementChild;
        }

        function createItemCardHTML(item) {
            const catObj = categories.find(c => c.name === item.cat);
            const catColor = catObj ? catObj.color : '#6366f1';

            return `
                <div class="p-3 rounded-2xl border flex items-center justify-between gap-2.5 transition-all ${
                    item.done ? 'bg-slate-900/40 border-slate-800/60 opacity-50 line-through' : 'bg-slate-800/90 border-slate-700/80 shadow-md'
                }">
                    <div class="flex items-center gap-2.5 flex-1 min-w-0" onclick="toggleItemDone(${item.id})">
                        <div class="w-5 h-5 rounded-md border-2 flex items-center justify-center shrink-0 ${item.done ? 'bg-indigo-600 border-indigo-600 text-white' : 'border-slate-600'}">
                            ${item.done ? '<i data-lucide="check" class="w-3.5 h-3.5"></i>' : (item.type === 'event' ? '<i data-lucide="calendar" class="w-3 h-3 text-slate-400"></i>' : '')}
                        </div>
                        <div class="min-w-0 flex-1">
                            <div class="flex items-center gap-1.5">
                                <span class="text-xs font-semibold text-slate-100 truncate">${escapeHtml(item.title)}</span>
                                ${item.repeat !== 'none' ? '<i data-lucide="repeat" class="w-3 h-3 text-amber-400"></i>' : ''}
                            </div>
                            <div class="flex items-center gap-1.5 text-[10px] text-slate-400 mt-0.5">
                                <span class="px-1.5 py-0.2 rounded font-bold" style="background-color: ${catColor}20; color: ${catColor}">${escapeHtml(item.cat)}</span>
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center gap-1">
                        <button onclick="openCreateModal(${item.id})" class="p-1 text-slate-400 hover:text-white"><i data-lucide="edit-3" class="w-3.5 h-3.5"></i></button>
                        <button onclick="deleteItem(${item.id})" class="p-1 text-slate-400 hover:text-red-400"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                    </div>
                </div>
            `;
        }

        function isRepeatingOn(item, dateStr) {
            if (item.repeat === 'none' || !item.date) return false;
            if (dateStr < item.date) return false;
            const d1 = new Date(item.date);
            const d2 = new Date(dateStr);
            if (item.repeat === 'daily') return true;
            if (item.repeat === 'weekly') return d1.getDay() === d2.getDay();
            if (item.repeat === 'monthly') return d1.getDate() === d2.getDate();
            return false;
        }

        function toggleItemDone(id) {
            items = items.map(i => {
                if (i.id === id) {
                    const newDone = !i.done;
                    if (newDone) checkStreakUpdate();
                    return { ...i, done: newDone };
                }
                return i;
            });
            saveData();
            if (navigator.vibrate) navigator.vibrate(15);
        }

        function checkStreakUpdate() {
            if (streakData.lastDoneDate !== todayStr) {
                streakData.count += 1;
                streakData.lastDoneDate = todayStr;
            }
        }

        function updateStreakUI() {
            document.getElementById('streak-count').textContent = streakData.count;
        }

        function deleteItem(id) {
            items = items.filter(i => i.id !== id);
            saveData();
        }

        function openCreateModal(arg = null) {
            renderCategoriesSelect();
            const m = document.getElementById('modal');
            
            if (typeof arg === 'number') {
                const item = items.find(i => i.id === arg);
                if (!item) return;
                document.getElementById('modal-title-text').textContent = 'Eintrag bearbeiten';
                document.getElementById('edit-item-id').value = item.id;
                document.getElementById('item-title').value = item.title;
                document.getElementById('item-date').value = item.date;
                document.getElementById('item-start-time').value = item.startTime || '';
                document.getElementById('item-end-time').value = item.endTime || '';
                document.getElementById('item-cat').value = item.cat;
                document.getElementById('item-prio').value = item.prio;
                document.getElementById('item-repeat').value = item.repeat || 'none';
                setType(item.type);
            } else {
                document.getElementById('modal-title-text').textContent = 'Neuer Eintrag';
                document.getElementById('edit-item-id').value = '';
                document.getElementById('item-title').value = '';
                document.getElementById('item-date').value = (typeof arg === 'string') ? arg : selectedDateStr;
                document.getElementById('item-start-time').value = '';
                document.getElementById('item-end-time').value = '';
                document.getElementById('item-repeat').value = 'none';
                setType('todo');
            }

            m.classList.remove('hidden');
            setTimeout(() => m.classList.remove('opacity-0'), 10);
        }

        function closeModal() {
            const m = document.getElementById('modal');
            m.classList.add('opacity-0');
            setTimeout(() => m.classList.add('hidden'), 200);
        }

        function renderCategoriesSelect() {
            const sel = document.getElementById('item-cat');
            sel.innerHTML = categories.map(c => `<option value="${escapeHtml(c.name)}">${escapeHtml(c.name)}</option>`).join('');
        }

        function setType(type) {
            selectedType = type;
            const btnTodo = document.getElementById('type-btn-todo');
            const btnEvent = document.getElementById('type-btn-event');
            if (type === 'todo') {
                btnTodo.className = "py-1.5 text-xs font-bold rounded-lg bg-indigo-600 text-white transition-all";
                btnEvent.className = "py-1.5 text-xs font-bold rounded-lg text-slate-400 transition-all";
            } else {
                btnEvent.className = "py-1.5 text-xs font-bold rounded-lg bg-indigo-600 text-white transition-all";
                btnTodo.className = "py-1.5 text-xs font-bold rounded-lg text-slate-400 transition-all";
            }
        }

        function saveItem() {
            const title = document.getElementById('item-title').value.trim();
            if (!title) return;

            const editId = document.getElementById('edit-item-id').value;
            const itemData = {
                type: selectedType,
                title,
                date: document.getElementById('item-date').value || selectedDateStr,
                startTime: document.getElementById('item-start-time').value,
                endTime: document.getElementById('item-end-time').value,
                cat: document.getElementById('item-cat').value,
                prio: document.getElementById('item-prio').value,
                repeat: document.getElementById('item-repeat').value,
                done: false
            };

            if (editId) {
                items = items.map(i => i.id == editId ? { ...i, ...itemData } : i);
            } else {
                items.push({ id: Date.now(), ...itemData });
            }

            closeModal();
            saveData();
        }

        function openBriefing() {
            const todaysItems = items.filter(i => i.date === todayStr || isRepeatingOn(i, todayStr));
            const pending = todaysItems.filter(i => !i.done);
            const events = todaysItems.filter(i => i.type === 'event');

            const content = document.getElementById('briefing-content');
            content.innerHTML = `
                <div class="bg-slate-800/80 p-3 rounded-xl border border-slate-700">
                    <div class="text-xs text-slate-400">Offene Quests heute</div>
                    <div class="text-2xl font-black text-amber-400">${pending.length}</div>
                </div>
                <div class="bg-slate-800/80 p-3 rounded-xl border border-slate-700">
                    <div class="text-xs text-slate-400">Termine heute</div>
                    <div class="text-2xl font-black text-indigo-400">${events.length}</div>
                </div>
            `;

            const modal = document.getElementById('briefing-modal');
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.remove('opacity-0'), 10);
        }

        function closeBriefing() {
            const modal = document.getElementById('briefing-modal');
            modal.classList.add('opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 200);
        }

        function changeMonth(delta) { currentDate.setMonth(currentDate.getMonth() + delta); renderCalendar(); }
        function selectToday() { currentDate = new Date(); openDaySheet(todayStr); renderCalendar(); }
        function escapeHtml(str) { return str ? str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)) : ''; }

        saveData();
    </script>
</body>
</html>
