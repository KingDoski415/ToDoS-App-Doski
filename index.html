<!DOCTYPE html>
<html lang="de" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>King Quests</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; user-select: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-full flex flex-col font-sans">
    <div class="max-w-md w-full mx-auto h-full flex flex-col bg-slate-900 overflow-hidden relative shadow-2xl">
        
        <!-- Header -->
        <header class="px-5 pt-6 pb-4 bg-slate-900/90 backdrop-blur-md sticky top-0 z-20 border-b border-slate-800 flex items-center justify-between">
            <div>
                <div class="flex items-center gap-2">
                    <i data-lucide="crown" class="w-5 h-5 text-amber-400"></i>
                    <h1 class="text-xl font-black text-white">King Quests</h1>
                </div>
                <p id="counter-sub" class="text-xs text-slate-400 mt-0.5">Lade Aufgaben...</p>
            </div>
            <button onclick="toggleModal(true)" class="w-10 h-10 rounded-xl bg-indigo-600 text-white flex items-center justify-center shadow-lg shadow-indigo-600/30 active:scale-95 transition-transform">
                <i data-lucide="plus" class="w-5 h-5"></i>
            </button>
        </header>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto no-scrollbar p-4 space-y-4">
            
            <!-- Progress Bar Card -->
            <div class="bg-gradient-to-r from-indigo-600 to-violet-600 rounded-2xl p-4 shadow-lg text-white">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs font-semibold uppercase tracking-wider text-indigo-200">Fortschritt</span>
                    <span id="progress-percent" class="text-lg font-black">0%</span>
                </div>
                <div class="w-full bg-black/20 h-2 rounded-full overflow-hidden">
                    <div id="progress-bar" class="bg-white h-full w-0 transition-all duration-300 rounded-full"></div>
                </div>
            </div>

            <!-- Filter -->
            <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
                <button onclick="setFilter('all')" data-f="all" class="filter-btn px-3 py-1.5 rounded-xl text-xs font-bold bg-indigo-600 text-white whitespace-nowrap transition-all">Alle</button>
                <button onclick="setFilter('King Quests')" data-f="King Quests" class="filter-btn px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-800 text-slate-400 whitespace-nowrap transition-all">👑 King Quests</button>
                <button onclick="setFilter('Arbeit')" data-f="Arbeit" class="filter-btn px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-800 text-slate-400 whitespace-nowrap transition-all">💼 Arbeit</button>
                <button onclick="setFilter('Privat')" data-f="Privat" class="filter-btn px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-800 text-slate-400 whitespace-nowrap transition-all">🏠 Privat</button>
            </div>

            <!-- Task List -->
            <div id="task-list" class="space-y-2.5 pb-20"></div>

            <!-- Empty State -->
            <div id="empty-state" class="hidden flex-col items-center justify-center py-12 text-center">
                <i data-lucide="check-circle" class="w-10 h-10 text-slate-600 mb-2"></i>
                <p class="text-sm text-slate-400 font-medium">Keine Aufgaben in dieser Liste</p>
            </div>
        </main>

        <!-- Modal -->
        <div id="modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-end justify-center hidden opacity-0 transition-opacity duration-200">
            <div class="bg-slate-900 w-full max-w-md rounded-t-3xl p-5 border-t border-slate-800 space-y-4">
                <div class="flex justify-between items-center">
                    <h3 class="font-bold text-white text-base">Neue Quest hinzufügen</h3>
                    <button onclick="toggleModal(false)" class="text-slate-400 p-1"><i data-lucide="x" class="w-5 h-5"></i></button>
                </div>
                <input type="text" id="task-title" placeholder="Aufgabenbezeichnung..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500">
                <div class="grid grid-cols-2 gap-3">
                    <select id="task-cat" class="bg-slate-800 border border-slate-700 rounded-xl px-3 py-3 text-sm text-white focus:outline-none">
                        <option value="King Quests">👑 King Quests</option>
                        <option value="Arbeit">💼 Arbeit</option>
                        <option value="Privat">🏠 Privat</option>
                    </select>
                    <select id="task-prio" class="bg-slate-800 border border-slate-700 rounded-xl px-3 py-3 text-sm text-white focus:outline-none">
                        <option value="hoch">🔥 Hoch</option>
                        <option value="mittel" selected>⚡ Mittel</option>
                        <option value="niedrig">🌱 Niedrig</option>
                    </select>
                </div>
                <button onclick="addTask()" class="w-full py-3.5 bg-indigo-600 text-white font-bold rounded-xl shadow-lg shadow-indigo-600/30 active:scale-95 transition-transform">
                    Speichern
                </button>
            </div>
        </div>

    </div>

    <script>
        let tasks = JSON.parse(localStorage.getItem('king_quests_v2')) || [
            { id: 1, title: 'Erste King Quest starten', cat: 'King Quests', prio: 'hoch', done: false }
        ];
        let filter = 'all';

        function save() {
            localStorage.setItem('king_quests_v2', JSON.stringify(tasks));
            render();
        }

        function render() {
            const list = document.getElementById('task-list');
            const empty = document.getElementById('empty-state');
            list.innerHTML = '';

            const filtered = tasks.filter(t => filter === 'all' || t.cat === filter);

            if (filtered.length === 0) {
                empty.classList.remove('hidden');
                empty.classList.add('flex');
            } else {
                empty.classList.add('hidden');
                empty.classList.remove('flex');

                filtered.forEach(t => {
                    const card = document.createElement('div');
                    card.className = `p-3.5 rounded-xl border flex items-center justify-between gap-3 transition-all ${
                        t.done ? 'bg-slate-900/50 border-slate-800/60 opacity-50 line-through' : 'bg-slate-900 border-slate-800 shadow-sm'
                    }`;
                    card.innerHTML = `
                        <div class="flex items-center gap-3 flex-1 min-w-0" onclick="toggleTask(${t.id})">
                            <div class="w-5 h-5 rounded-md border-2 flex items-center justify-center shrink-0 ${t.done ? 'bg-indigo-600 border-indigo-600 text-white' : 'border-slate-600'}">
                                ${t.done ? '<i data-lucide="check" class="w-3.5 h-3.5"></i>' : ''}
                            </div>
                            <div class="min-w-0 flex-1">
                                <div class="text-sm font-medium text-slate-100 truncate">${escapeHtml(t.title)}</div>
                                <div class="text-[10px] text-slate-400 mt-0.5">${escapeHtml(t.cat)}</div>
                            </div>
                        </div>
                        <button onclick="deleteTask(${t.id})" class="text-slate-500 hover:text-red-400 p-1"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    `;
                    list.appendChild(card);
                });
            }

            // Progress stats
            const total = tasks.length;
            const done = tasks.filter(t => t.done).length;
            const pct = total > 0 ? Math.round((done / total) * 100) : 0;
            document.getElementById('progress-percent').textContent = `${pct}%`;
            document.getElementById('progress-bar').style.width = `${pct}%`;
            document.getElementById('counter-sub').textContent = `${total - done} Aufgaben offen`;

            lucide.createIcons();
        }

        function addTask() {
            const titleInput = document.getElementById('task-title');
            const title = titleInput.value.trim();
            if (!title) return;

            tasks.unshift({
                id: Date.now(),
                title,
                cat: document.getElementById('task-cat').value,
                prio: document.getElementById('task-prio').value,
                done: false
            });

            titleInput.value = '';
            toggleModal(false);
            save();
        }

        function toggleTask(id) {
            tasks = tasks.map(t => t.id === id ? { ...t, done: !t.done } : t);
            save();
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            save();
        }

        function setFilter(f) {
            filter = f;
            document.querySelectorAll('.filter-btn').forEach(b => {
                if (b.dataset.f === f) {
                    b.className = 'filter-btn px-3 py-1.5 rounded-xl text-xs font-bold bg-indigo-600 text-white whitespace-nowrap transition-all';
                } else {
                    b.className = 'filter-btn px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-800 text-slate-400 whitespace-nowrap transition-all';
                }
            });
            render();
        }

        function toggleModal(show) {
            const m = document.getElementById('modal');
            if (show) {
                m.classList.remove('hidden');
                setTimeout(() => m.classList.remove('opacity-0'), 10);
            } else {
                m.classList.add('opacity-0');
                setTimeout(() => m.classList.add('hidden'), 200);
            }
        }

        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        render();
    </script>
</body>
</html>
